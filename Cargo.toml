[package]
name = "peafren"
version = "0.1.0"
edition = "2021"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
azalea =  "0.10.3+mc1.2.1"
parking_lot = "0.12.3"
reqwest = { version = "0.12.12", features = ["json"] }
serde_json = "1.0.135"

